[workspace]
members = [
    "crates/neon-protocol",
    "crates/neon-ipc",
    "crates/neon-observability",
    "crates/neon-world-bridge",
    "crates/neon-projectd",
    "crates/neon-eventd",
    "crates/neon-ui-schema",
    "crates/neon-wgpu-runtime",
    "crates/neon-wgpu-ai",
    "crates/neon-gpu-ecs",
    "crates/neon-ui-runtime",
    "crates/neon-ui",
    "crates/neon-cli",
    "crates/neon-dev",
    "crates/neon-android-host",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.2.6"
repository = "https://github.com/unco999/Neon3-CiJian"
homepage = "https://github.com/unco999/Neon3-CiJian"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = { version = "1.24", features = ["derive"] }
pollster = "0.4"
wgpu = "30.0"
winit = "0.30"
fontdue = "0.9"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
