[workspace]
members = [
    "crates/neon-protocol",
    "crates/neon-ipc",
    "crates/neon-observability",
    "crates/neon-projectd",
    "crates/neon-ui-schema",
    "crates/neon-wgpu-runtime",
    "crates/neon-wgpu-ai",
    "crates/neon-ui-runtime",
    "crates/neon-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = { version = "1.24", features = ["derive"] }
pollster = "0.4"
wgpu = "30.0"
winit = "0.30"
fontdue = "0.9"
