[package]
name = "neon-editor-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless revisioned document service for Neon3 code editors"
repository.workspace = true

[dependencies]
neon-editor = { version = "0.1", path = "../neon-editor" }
neon-ipc = { version = "0.2.0", path = "../neon-ipc" }
neon-observability = { version = "0.2.0", path = "../neon-observability" }
neon-protocol = { version = "0.2.0", path = "../neon-protocol" }
serde.workspace = true
serde_json.workspace = true

[[bin]]
name = "editor_protocol_probe"
path = "src/bin/editor_protocol_probe.rs"
